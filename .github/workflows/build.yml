name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: |
          xcodebuild -project KeyBuddy.xcodeproj \
            -scheme KeyBuddy \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as Zip
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/KeyBuddy.app \
            KeyBuddy.zip

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: KeyBuddy.zip
          path: KeyBuddy.zip

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: KeyBuddy.zip
